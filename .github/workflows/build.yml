# Compila o APK na cloud do GitHub sempre que fazes push.
# Depois vais a Actions -> último build -> "MeuTube-apk" para descarregar.
name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        shell: bash
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --console=plain 2>&1 | tee build.log || {
            # Em caso de erro, resume as linhas importantes numa "anotação"
            # (aparece no topo da página do build e é fácil de ler)
            msg=$(grep -E "^e: |What went wrong|Could not|error:|> " build.log | head -40 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=Build falhou::$msg"
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: MeuTube-apk
          path: app/build/outputs/apk/debug/app-debug.apk
